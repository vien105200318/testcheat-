name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Tools
      run: |
        brew install ldid

    - name: Build App
      run: |
        # Get iOS SDK
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Using SDK: $SDK_PATH"

        # Compile all source files
        clang -arch arm64 \
          -isysroot "$SDK_PATH" \
          -miphoneos-version-min=14.0 \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          -framework UniformTypeIdentifiers \
          -fobjc-arc \
          -Wno-deprecated-declarations \
          -o DylibInjector \
          AppDelegate.m ViewController.m AppListManager.m DylibInjector.m

        echo "Build completed"

    - name: Create App Bundle
      run: |
        # Create app bundle structure
        mkdir -p Payload/DylibInjector.app

        # Copy binary
        cp DylibInjector Payload/DylibInjector.app/

        # Copy Info.plist
        cp Info.plist Payload/DylibInjector.app/

        # Copy entitlements (for reference)
        cp entitlements.plist Payload/DylibInjector.app/

        # Create empty LaunchScreen.storyboardc (minimal)
        mkdir -p Payload/DylibInjector.app/Base.lproj

        # Create a minimal PkgInfo
        echo -n "APPL????" > Payload/DylibInjector.app/PkgInfo

        echo "App bundle created"
        ls -la Payload/DylibInjector.app/

    - name: Sign with ldid
      run: |
        # Sign the binary with entitlements
        ldid -Sentitlements.plist Payload/DylibInjector.app/DylibInjector

        echo "Signing completed"

    - name: Create IPA
      run: |
        # Create IPA file
        zip -r DylibInjector.ipa Payload

        echo "IPA created"
        ls -la *.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DylibInjector-IPA
        path: DylibInjector.ipa
        if-no-files-found: error

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: DylibInjector v1.0.${{ github.run_number }}
        body: |
          iOS Dylib Injector for TrollStore

          Install via TrollStore
        files: DylibInjector.ipa
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
