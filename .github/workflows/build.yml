name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Tools
      run: |
        brew install ldid lz4 lzfse

    - name: Build App
      run: |
        # Get iOS SDK
        SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
        echo "Using SDK: $SDK_PATH"

        # Include paths
        INCLUDES="-I. -Ikexploit -ITaskRop -Iutils -Iresearch -IXPF/src -IXPF/external/ChOma/src"

        # Objective-C source files
        OBJC_SOURCES="
          AppDelegate.m
          ViewController.m
          AppListManager.m
          DylibInjector.m
          kexploit/kexploit_opa334.m
          kexploit/krw.m
          kexploit/kutils.m
          kexploit/offsets.m
          kexploit/persistence.m
          kexploit/vnode.m
          TaskRop/RemoteCall.m
          TaskRop/PAC.m
          TaskRop/VM.m
          TaskRop/Thread.m
          TaskRop/Exception.m
          TaskRop/MigFilterBypassThread.m
          utils/sandbox.m
          utils/file.m
          utils/process.m
          utils/hexdump.m
          research/amfi_research.m
          research/sandbox_research.m
          research/vnode_research.m
        "

        # C source files (XPF/ChOma)
        C_SOURCES="
          XPF/src/xpf.c
          XPF/src/common.c
          XPF/src/decompress.c
          XPF/src/ppl.c
          XPF/src/non_ppl.c
          XPF/src/bad_recovery.c
          XPF/external/ChOma/src/FileStream.c
          XPF/external/ChOma/src/CodeDirectory.c
          XPF/external/ChOma/src/Entitlements.c
          XPF/external/ChOma/src/MachOLoadCommand.c
          XPF/external/ChOma/src/CSBlob.c
          XPF/external/ChOma/src/Util.c
          XPF/external/ChOma/src/DyldSharedCache.c
          XPF/external/ChOma/src/MemoryStream.c
          XPF/external/ChOma/src/PatchFinder_arm64.c
          XPF/external/ChOma/src/PatchFinder.c
          XPF/external/ChOma/src/MachO.c
          XPF/external/ChOma/src/Host.c
          XPF/external/ChOma/src/DER.c
          XPF/external/ChOma/src/Fat.c
          XPF/external/ChOma/src/Base64.c
          XPF/external/ChOma/src/BufferedStream.c
          XPF/external/ChOma/src/arm64.c
        "

        # Compile C files first (no ARC)
        echo "Compiling C sources..."
        for src in $C_SOURCES; do
          if [ -f "$src" ]; then
            obj=$(basename "$src" .c).o
            clang -arch arm64 \
              -isysroot "$SDK_PATH" \
              -miphoneos-version-min=14.0 \
              $INCLUDES \
              -DHAVE_COMPRESSION \
              -Wno-deprecated-declarations \
              -Wno-incompatible-pointer-types \
              -Wno-unused-function \
              -c "$src" -o "$obj"
            echo "  Compiled: $src"
          fi
        done

        # Compile Objective-C files with ARC
        echo "Compiling Objective-C sources..."
        for src in $OBJC_SOURCES; do
          if [ -f "$src" ]; then
            obj=$(basename "$src" .m).o
            clang -arch arm64 \
              -isysroot "$SDK_PATH" \
              -miphoneos-version-min=14.0 \
              $INCLUDES \
              -fobjc-arc \
              -Wno-deprecated-declarations \
              -Wno-incompatible-pointer-types \
              -Wno-unused-function \
              -Wno-nullability-completeness \
              -c "$src" -o "$obj"
            echo "  Compiled: $src"
          fi
        done

        # Link all object files
        echo "Linking..."
        clang -arch arm64 \
          -isysroot "$SDK_PATH" \
          -miphoneos-version-min=14.0 \
          -framework Foundation \
          -framework UIKit \
          -framework CoreGraphics \
          -framework UniformTypeIdentifiers \
          -framework Security \
          -framework MobileCoreServices \
          -framework IOKit \
          -lz \
          -llzma \
          -lcompression \
          -o DylibInjector \
          *.o

        echo "Build completed"
        rm -f *.o

    - name: Create App Bundle
      run: |
        # Create app bundle structure
        mkdir -p Payload/DylibInjector.app

        # Copy binary
        cp DylibInjector Payload/DylibInjector.app/

        # Copy Info.plist
        cp Info.plist Payload/DylibInjector.app/

        # Copy entitlements (for reference)
        cp entitlements.plist Payload/DylibInjector.app/

        # Copy DarksWorld JSON if exists
        if [ -f darksworld.json ]; then
          cp darksworld.json Payload/DylibInjector.app/
        fi

        # Create empty LaunchScreen.storyboardc (minimal)
        mkdir -p Payload/DylibInjector.app/Base.lproj

        # Create a minimal PkgInfo
        echo -n "APPL????" > Payload/DylibInjector.app/PkgInfo

        echo "App bundle created"
        ls -la Payload/DylibInjector.app/

    - name: Sign with ldid
      run: |
        # Sign the binary with entitlements
        ldid -Sentitlements.plist Payload/DylibInjector.app/DylibInjector

        echo "Signing completed"

    - name: Create IPA
      run: |
        # Create IPA file
        zip -r DylibInjector.ipa Payload

        echo "IPA created"
        ls -la *.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DylibInjector-IPA
        path: DylibInjector.ipa
        if-no-files-found: error

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: DylibInjector v1.0.${{ github.run_number }}
        body: |
          iOS Dylib Injector với Kernel Exploit (Cyanide/DarksWorld)

          Hỗ trợ iOS 16.0 - 18.x (không cần jailbreak hoặc TrollStore)

          Cài đặt qua Esign hoặc Sideloadly
        files: DylibInjector.ipa
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
